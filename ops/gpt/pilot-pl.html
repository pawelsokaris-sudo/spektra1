<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pilot oceny naturalności — PL</title>
<style>
:root{--ink:#17211c;--muted:#5e6a63;--paper:#f5f7f2;--card:#fff;--line:#cbd4cc;--green:#145c3c;--green2:#e7f2eb;--focus:#b34b16;--shadow:0 18px 60px rgba(28,45,35,.11)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(90deg,#e8eee8 0 12px,transparent 12px),var(--paper);color:var(--ink);font:18px/1.62 Georgia,"Times New Roman",serif}.shell{width:min(920px,calc(100% - 32px));margin:0 auto;padding:40px 0 80px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.mark{font:700 13px/1.2 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}.status{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;font:700 12px/1 Arial,sans-serif;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(24px,5vw,52px);box-shadow:var(--shadow)}h1{font-size:clamp(34px,6vw,62px);line-height:1.02;letter-spacing:-.035em;margin:0 0 22px;max-width:12ch}h2{font-size:clamp(28px,4vw,42px);line-height:1.08;margin:0 0 18px}p{margin:0 0 1em}.lead{font-size:1.12em;color:#35433b}.note{border-left:4px solid var(--green);padding:10px 0 10px 18px;color:var(--muted)}button{appearance:none;border:0;border-radius:12px;background:var(--green);color:#fff;font:700 17px/1.25 Arial,sans-serif;padding:16px 22px;cursor:pointer;transition:transform .12s,box-shadow .12s}button:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(20,92,60,.18)}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:4px solid rgba(179,75,22,.28);outline-offset:3px}.pair-meta{font:700 12px/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:14px}.context{background:#f0f3ee;border-radius:14px;padding:clamp(18px,4vw,30px);white-space:pre-line}.context-label,.answer-label{font:700 12px/1.2 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:10px}.sentences{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.sentence{border:1px solid var(--line);border-radius:14px;padding:22px;background:#fff}.sentence b{display:block;font:800 13px/1 Arial,sans-serif;color:var(--green);margin-bottom:10px}.answers{display:grid;gap:10px}.answers button{background:#fff;color:var(--ink);border:1px solid #aebbb0;text-align:left;font-weight:600}.answers button:hover{border-color:var(--green);background:var(--green2);box-shadow:none}.field{margin:24px 0}.field label{font-weight:700;display:block;margin-bottom:8px}.field small{display:block;color:var(--muted);margin-bottom:8px}textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:14px;font:17px/1.5 Georgia,serif}.scale{display:flex;gap:10px;flex-wrap:wrap}.scale label{display:grid;place-items:center;width:52px;height:52px;border:1px solid var(--line);border-radius:50%;background:#fff;cursor:pointer;font:700 16px Arial,sans-serif}.scale input{position:absolute;opacity:0}.scale label:has(input:checked){background:var(--green);color:#fff;border-color:var(--green)}.json{width:100%;min-height:250px;font:13px/1.45 Consolas,monospace}.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.proof div{background:var(--green2);border-radius:10px;padding:12px}.proof b{display:block;font:700 11px Arial,sans-serif;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.hidden{display:none!important}@media(max-width:650px){body{font-size:17px}.shell{width:min(100% - 20px,920px);padding-top:22px}.sentences{grid-template-columns:1fr}.card{border-radius:14px}.proof{grid-template-columns:1fr}header{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main class="shell"><header><div class="mark">Badanie językowe · pilot PL</div><div id="status" class="status">Zgoda</div></header><section id="app" class="card"></section></main>
<script>
"use strict";
const PAIRS=[
{id:"pl-05-przetwory",context:`Kiszę ogórki w kamionce i po trzech dniach solanka zrobiła się mętna oraz śliska. Obok w drugim słoiku kiszę kapustę według przepisu babci i ta zawsze wychodzi dobrze. W piwnicy wisi termometr z zapisem, więc wiem dokładnie, jak zmienia się tam temperatura. Ogórki były świeże, prosto z targu, a soli dałem łyżkę na jeden litr wody. Czy taka śliska solanka nadaje się jeszcze do uratowania, czy trzeba wylać całość? Śliska solanka oznacza zwykle za słaby roztwór, w którym rozwinęły się niewłaściwe bakterie. Łyżka soli na litr to około dwóch procent, a ogórki potrzebują raczej trzech.`,a:`Ten sam układ zależności widać przy tym drugim słoiku, gdzie proporcje znaczą więcej niż sam czas.`,b:`Ten sam układ zależności widać przy tym termometrze, gdzie proporcje znaczą więcej niż sam czas.`},
{id:"pl-10-dach-gontowy",context:`Kryję dach drewutni gontem osikowym i chciałbym zrobić to tak, żeby wytrzymał trzydzieści lat. Obok stoi stara wiata, którą dziadek pokrył gontem i która do dziś nie przecieka. Kupiłem wilgotnościomierz, bo sprzedawca gontu twierdził, że drewno jest już zupełnie suche. Więźba jest nowa, łacenie zrobiłem co dwanaście centymetrów, a okap wystaje na dłoń. Czy zaczynać krycie od okapu w dwóch warstwach, czy wystarczy jedna warstwa startowa? Okap kryj zawsze podwójnie, bo tam spływa najwięcej wody i tam gont pracuje najciężej. Pierwszą warstwę ułóż odwrotnie, rowkiem do góry, i dopiero na niej kładź warstwę właściwą.`,a:`Ten sam porządek widać przy tej starej wiacie, gdzie kolejność działań znaczy więcej niż poświęcony czas.`,b:`Ten sam porządek widać przy tym wilgotnościomierzu, gdzie kolejność działań znaczy więcej niż poświęcony czas.`},
{id:"pl-12-rower-szosowy",context:`Składam do kupy stary rower szosowy i chciałbym wreszcie ustawić tylną przerzutkę bez przeskoków. Przednie koło mam z innego roweru i przy hamowaniu wyraźnie ociera o klocek. Na kierownicy zamontowałem czujnik kadencji, bo chcę jeździć równiej i pilnować tempa. Łańcuch jest nowy, kaseta stara, a linka przerzutki chodzi w pancerzu dość opornie. Czy zaczynać od wymiany linki, czy najpierw ustawiać ograniczniki na samej przerzutce? Zacznij od linki i pancerza, bo opór w pancerzu psuje każde późniejsze ustawienie. Przerzutka wraca sprężyną, więc każdy dodatkowy opór odbija się na biegach najlżejszych. Dopiero po wymianie linki ustawiaj ograniczniki, zaczynając zawsze od najmniejszej zębatki na kasecie. Na końcu reguluj napięcie linki bębenkiem, mając łańcuch na środkowej zębatce kasety. Wymieniłem linkę i pancerz, a przerzutka chodzi teraz dużo lżej niż wcześniej. Przy okazji odkręciłem to przednie koło i zobaczyłem, że obręcz ma wyraźną ósemkę. Biegi wchodzą równo w górę, ale przy schodzeniu w dół łańcuch zawsze przeskakuje dwa. Czy to nadal kwestia napięcia linki, czy raczej zużytych zębów na starej kasecie? Przeskok o dwie zębatki w dół wskazuje zwykle na zbyt duże napięcie linki. Poluzuj bębenek o ćwierć obrotu i sprawdź zmianę biegu przy kręcących się korbach. Jeśli przeskok zostanie, obejrzyj wieszak przerzutki, bo bywa lekko wygięty do środka. Zużyta kaseta objawia się inaczej: łańcuch przeskakuje pod obciążeniem na jednym biegu. Poluzowałem bębenek i przeskoki w dół zniknęły na wszystkich biegach oprócz ostatniego. Czujnik kadencji pokazuje, że przy tym biegu kręcę wyraźnie wolniej niż zwykle. Na największej zębatce łańcuch chodzi głośno i lekko ociera o wieszak przerzutki. Czy to już wina wieszaka, czy raczej zbyt krótkiego łańcucha na tej kasecie? Głośna praca na największej zębatce to zwykle wieszak odchylony o kilka milimetrów. Sprawdź go patrząc od tyłu: rolki przerzutki muszą stać dokładnie w jednej płaszczyźnie.`,a:`To trochę przypomina to przednie koło, jeśli patrzeć wyłącznie na kolejność wprowadzanych poprawek.`,b:`To trochę przypomina ten czujnik kadencji, jeśli patrzeć wyłącznie na kolejność wprowadzanych poprawek.`},
{id:"pl-16-mlyn-wodny",context:`Kupiłem stary młyn wodny nad rzeką i chciałbym wreszcie doprowadzić koło do porządnej pracy. Pod dachem leży jeszcze zapasowy kamień, który poprzedni młynarz kazał kiedyś porządnie nasiekać. Przy zsypie stoi waga zbożowa z zapisem, bo każdy worek muszę notować osobno. Koło obraca się nierówno i przy większej wodzie zaczyna wyraźnie szarpać w łożyskach. Czy zaczynać od wyrównania łopatek, czy raczej od samego ustawienia jazu i przepustu? Zacznij od jazu, bo bez równego napływu wody każda poprawka łopatek będzie tylko zgadywaniem. Strumień musi trafiać w łopatki zawsze w tym samym miejscu, inaczej koło szarpie przy każdym obrocie. Dopiero potem sprawdzaj same łopatki, bo teraz nie odróżnisz wady drewna od wady napływu. Kamienie zostaw na koniec, kiedy koło będzie już szło równo przez całą godzinę. Poprawiłem jaz deskami i strumień trafia teraz w łopatki znacznie równiej niż przedtem. Szarpanie ustało, ale koło nadal zwalnia zawsze w tym samym punkcie obrotu. Czy to znaczy, że jedna łopatka nabiera mniej wody, czy raczej że wał jest krzywy? Mam pod ręką pion i długi sznurek, więc mogę zmierzyć bicie wieńca bez rozbierania. Zmierz najpierw bicie wieńca, bo krzywy wał daje zwolnienie zawsze w tej samej ćwiartce. Pojedyncza łopatka zdradza się inaczej: koło gubi siłę nieregularnie, a nie co pełny obrót. Jeśli bicie przekracza dwa centymetry, klinuj wał w łożysku, zanim ruszysz drewno wieńca. Potem obserwuj przez tydzień, czy zwolnienie nie wraca przy niższym stanie wody w rzece. Bicie wynosiło prawie trzy centymetry, więc zaklinowałem wał i koło idzie teraz spokojnie. Waga zbożowa pokazuje przy okazji, że przemiał idzie o jedną trzecią szybciej niż wcześniej. Chciałbym teraz położyć na wale ten zapasowy kamień, bo obecny ma zupełnie wytarte bruzdy. Czy taka zamiana wymaga ponownego wyważenia, czy kamień sam się ułoży po kilku godzinach? Każdy kamień trzeba wyważyć osobno, bo nawet drobna nierównowaga bije potem w całe łożysko. Zapasowy kamień leżał lata pod dachem, więc sprawdź najpierw, czy nie ma włoskowatych pęknięć.`,a:`To trochę przypomina ten zapasowy kamień, jeśli patrzeć wyłącznie na kolejność poszczególnych kroków roboty.`,b:`To trochę przypomina tę wagę zbożową, jeśli patrzeć wyłącznie na kolejność poszczególnych kroków roboty.`},
{id:"pl-18-szewstwo",context:`Chciałbym sam naprawiać buty i zacząłem od pary starych trzewików po ojcu. Na półce stoi jeszcze drewniane kopyto, które dostałem razem z całym starym warsztatem. Na stole leży grubościomierz do skóry, bo na oko ciągle mylę się o milimetr. Zelówki w tych trzewikach są starte do cna, a przyszwa nadal trzyma się mocno. Czy zaczynać od zdjęcia starej zelówki, czy raczej od przygotowania nowej skóry? Zacznij od zdjęcia starej zelówki, bo dopiero pod nią zobaczysz stan podeszwy środkowej. Często okazuje się, że warstwa środkowa jest przemoczona i sama wymaga wymiany. Dopiero potem dobieraj skórę, bo grubość nowej zelówki zależy od tego, co zostanie pod spodem. Kopyto przyda ci się na końcu, przy naciąganiu cholewki i wykańczaniu obrzeża. Zdjąłem starą zelówkę i pod samym spodem znalazłem ciemną, wyraźnie wilgotną warstwę filcu. Filc rozpada się pod palcem, ale skórzana podeszwa główna wygląda całkiem zdrowo.`,a:`Coś takiego zdarza się także przy tym drewnianym kopycie, kiedy drobne niedopatrzenie odzywa się dopiero dużo później.`,b:`Coś takiego zdarza się także przy tym grubościomierzu, kiedy drobne niedopatrzenie odzywa się dopiero dużo później.`}
];
const COPY={consentTitle:"Zanim zaczniesz",start:"Rozumiem i zaczynam",context:"Kontekst rozmowy",choose:"Które zdanie brzmi naturalniej?",answers:["Zdanie A brzmi naturalniej","Zdanie B brzmi naturalniej","Oba brzmią równie naturalnie","Oba brzmią równie nienaturalnie"],debrief:"Dwa pytania na koniec",rule:"Czy zauważyłeś jakąś regułę w tym, czym różniły się porównywane zdania? Jeśli tak — jaką?",ruleHint:"Pole nieobowiązkowe",fatigue:"Jak bardzo zmęczyło Cię to zadanie?",finish:"Zapisz odpowiedzi",done:"Dziękujemy",copy:"Kopiuj wynik JSON",copied:"Skopiowano",copyFail:"Nie udało się skopiować automatycznie — zaznacz tekst poniżej i skopiuj ręcznie."};
const state={phase:"consent",index:-1,order:[],sides:{},responses:[],events:[],started_at:null,ended_at:null,pair_shown_at:null,context_returns:0,context_armed:false,context_visible:false};
const app=document.querySelector("#app"),statusEl=document.querySelector("#status");
function uuid(){return crypto.randomUUID?crypto.randomUUID():[1e7]+-1e3+-4e3+-8e3+-1e11.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))}
function randomInt(max){const a=new Uint32Array(1),limit=2**32-(2**32%max);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function event(type,previous,newState,data={}){state.events.push({event_id:uuid(),aggregate_id:sessionId,aggregate_type:"TimingPilotSession",event_type:type,previous_state:previous,new_state:newState,actor_id:"anonymous-local-participant",actor_type:"human",timestamp:new Date().toISOString(),correlation_id:sessionId,...data})}
const sessionId=uuid();
function setPhase(next,type,data={}){const previous=state.phase;state.phase=next;event(type,previous,next,data);render()}
function consent(){app.innerHTML=`<h1>${COPY.consentTitle}</h1><p class="lead">Badamy, jak ludzie oceniają naturalność zdań w rozmowie.</p><p>Pokażemy Ci fragmenty rozmów o pracach rzemieślniczych i poprosimy o krótkie sądy. <strong>Nie sprawdzamy Twojej wiedzy ani umiejętności</strong> — interesuje nas Twoje wrażenie językowe.</p><p>Zadanie ma 5 pytań. <strong>Nie wiemy jeszcze, ile zajmie — właśnie to mierzymy.</strong></p><p>Nie prosimy o imię, nazwisko ani dane kontaktowe. Nie zbieramy żadnych danych, które pozwalałyby Cię zidentyfikować.</p><p>Udział jest dobrowolny; możesz przerwać w każdej chwili, zamykając okno.</p><p class="note">Wynik pozostaje na tym urządzeniu. Na końcu możesz skopiować go jako JSON.</p><button id="start">${COPY.start}</button>`;document.querySelector("#start").onclick=start}
function start(){state.started_at=new Date().toISOString();state.order=shuffle(PAIRS.map(p=>p.id));for(const p of PAIRS)state.sides[p.id]=randomInt(2)?{A:"a",B:"b"}:{A:"b",B:"a"};state.index=0;setPhase("pair_active","ConsentAccepted",{screen_width:window.innerWidth,display_order:state.order,side_assignment:state.sides})}
function showPair(){const p=PAIRS.find(x=>x.id===state.order[state.index]),side=state.sides[p.id];state.pair_shown_at=performance.now();state.context_returns=0;state.context_armed=false;state.context_visible=false;statusEl.textContent=`Pytanie ${state.index+1} z ${PAIRS.length}`;app.innerHTML=`<div class="pair-meta">Fragment rozmowy</div><h2>Przeczytaj kontekst, potem porównaj zdania.</h2><div id="context" class="context"><span class="context-label">${COPY.context}</span>${p.context}</div><div class="sentences"><div class="sentence"><b>ZDANIE A</b>${p[side.A]}</div><div class="sentence"><b>ZDANIE B</b>${p[side.B]}</div></div><div id="choices" class="answers"><span class="answer-label">${COPY.choose}</span>${COPY.answers.map((x,i)=>`<button data-choice="${["A","B","equal","equally_unnatural"][i]}">${x}</button>`).join("")}</div>`;document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>answer(b.dataset.choice));observeContext()}
function observeContext(){const c=document.querySelector("#context"),choices=document.querySelector("#choices");const choiceObserver=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))state.context_armed=true},{threshold:.35});choiceObserver.observe(choices);const contextObserver=new IntersectionObserver(es=>{const visible=es[0].isIntersecting;if(state.context_armed&&visible&&!state.context_visible)state.context_returns++;state.context_visible=visible},{threshold:.25});contextObserver.observe(c)}
function answer(choice){const p=PAIRS.find(x=>x.id===state.order[state.index]),side=state.sides[p.id],duration=Math.round(performance.now()-state.pair_shown_at);state.responses.push({pair_id:p.id,response:choice,pair_duration_ms:duration,context_returns:state.context_returns,side_assignment:side});event("PairAnswered","pair_active",state.index===PAIRS.length-1?"debrief":"pair_active",{pair_id:p.id,response:choice,pair_duration_ms:duration,context_returns:state.context_returns,side_assignment:side});if(++state.index<PAIRS.length){showPair();window.scrollTo({top:0,behavior:"instant"})}else setPhase("debrief","AllPairsAnswered")}
function debrief(){statusEl.textContent="Pytania końcowe";app.innerHTML=`<h1>${COPY.debrief}</h1><div class="field"><label for="rule">${COPY.rule}</label><small>${COPY.ruleHint}</small><textarea id="rule"></textarea></div><div class="field"><label>${COPY.fatigue}</label><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="fatigue" value="${n}">${n}</label>`).join("")}</div></div><button id="finish" disabled>${COPY.finish}</button>`;document.querySelectorAll("[name=fatigue]").forEach(x=>x.onchange=()=>document.querySelector("#finish").disabled=false);document.querySelector("#finish").onclick=finish}
function finish(){state.ended_at=new Date().toISOString();state.debrief={noticed_rule:document.querySelector("#rule").value.trim(),fatigue:Number(document.querySelector("[name=fatigue]:checked").value)};setPhase("completed","DebriefSubmitted")}
function result(){return{schema_version:"spektra-timing-pilot/1.0",session_id:sessionId,language:"pl",state:state.phase,started_at:state.started_at,ended_at:state.ended_at,total_duration_ms:new Date(state.ended_at)-new Date(state.started_at),screen_width:window.innerWidth,display_order:state.order,side_assignment:state.sides,responses:state.responses,debrief:state.debrief,events:state.events}}
function done(){statusEl.textContent="Ukończono";const data=JSON.stringify(result(),null,2),last=state.events.at(-1);app.innerHTML=`<h1>${COPY.done}</h1><p class="lead">Wynik jest gotowy do skopiowania. Nic nie zostało wysłane.</p><div class="proof"><div><b>Status</b>Ukończono</div><div><b>Czas całkowity</b>${Math.round(result().total_duration_ms/1000)} s</div><div><b>Event ID</b>${last.event_id.slice(0,8)}…</div></div><button id="copy">${COPY.copy}</button><p id="copyStatus" role="status"></p><textarea class="json" id="json" readonly>${data}</textarea>`;document.querySelector("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(data);document.querySelector("#copyStatus").textContent=COPY.copied}catch(e){document.querySelector("#json").select();document.querySelector("#copyStatus").textContent=COPY.copyFail}}}
function render(){if(state.phase==="consent"){statusEl.textContent="Zgoda";consent()}else if(state.phase==="pair_active")showPair();else if(state.phase==="debrief")debrief();else if(state.phase==="completed")done()}
window.addEventListener("beforeunload",()=>{if(!["consent","completed"].includes(state.phase))event("SessionAbandoned",state.phase,"abandoned")});render();
</script></body></html>
