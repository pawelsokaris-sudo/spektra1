<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Naturalness timing pilot — EN</title>
<style>
:root{--ink:#17211c;--muted:#5e6a63;--paper:#f5f7f2;--card:#fff;--line:#cbd4cc;--green:#145c3c;--green2:#e7f2eb;--focus:#b34b16;--shadow:0 18px 60px rgba(28,45,35,.11)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(90deg,#e8eee8 0 12px,transparent 12px),var(--paper);color:var(--ink);font:18px/1.62 Georgia,"Times New Roman",serif}.shell{width:min(920px,calc(100% - 32px));margin:0 auto;padding:40px 0 80px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.mark{font:700 13px/1.2 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}.status{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;font:700 12px/1 Arial,sans-serif;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(24px,5vw,52px);box-shadow:var(--shadow)}h1{font-size:clamp(34px,6vw,62px);line-height:1.02;letter-spacing:-.035em;margin:0 0 22px;max-width:12ch}h2{font-size:clamp(28px,4vw,42px);line-height:1.08;margin:0 0 18px}p{margin:0 0 1em}.lead{font-size:1.12em;color:#35433b}.note{border-left:4px solid var(--green);padding:10px 0 10px 18px;color:var(--muted)}button{appearance:none;border:0;border-radius:12px;background:var(--green);color:#fff;font:700 17px/1.25 Arial,sans-serif;padding:16px 22px;cursor:pointer;transition:transform .12s,box-shadow .12s}button:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(20,92,60,.18)}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:4px solid rgba(179,75,22,.28);outline-offset:3px}.pair-meta{font:700 12px/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:14px}.context{background:#f0f3ee;border-radius:14px;padding:clamp(18px,4vw,30px);white-space:pre-line}.context-label,.answer-label{font:700 12px/1.2 Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:10px}.sentences{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.sentence{border:1px solid var(--line);border-radius:14px;padding:22px;background:#fff}.sentence b{display:block;font:800 13px/1 Arial,sans-serif;color:var(--green);margin-bottom:10px}.answers{display:grid;gap:10px}.answers button{background:#fff;color:var(--ink);border:1px solid #aebbb0;text-align:left;font-weight:600}.answers button:hover{border-color:var(--green);background:var(--green2);box-shadow:none}.field{margin:24px 0}.field label{font-weight:700;display:block;margin-bottom:8px}.field small{display:block;color:var(--muted);margin-bottom:8px}textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:14px;font:17px/1.5 Georgia,serif}.scale{display:flex;gap:10px;flex-wrap:wrap}.scale label{display:grid;place-items:center;width:52px;height:52px;border:1px solid var(--line);border-radius:50%;background:#fff;cursor:pointer;font:700 16px Arial,sans-serif}.scale input{position:absolute;opacity:0}.scale label:has(input:checked){background:var(--green);color:#fff;border-color:var(--green)}.json{width:100%;min-height:250px;font:13px/1.45 Consolas,monospace}.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.proof div{background:var(--green2);border-radius:10px;padding:12px}.proof b{display:block;font:700 11px Arial,sans-serif;text-transform:uppercase;color:var(--muted);margin-bottom:4px}@media(max-width:650px){body{font-size:17px}.shell{width:min(100% - 20px,920px);padding-top:22px}.sentences{grid-template-columns:1fr}.card{border-radius:14px}.proof{grid-template-columns:1fr}header{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main class="shell"><header><div class="mark">Language study · EN pilot</div><div id="status" class="status">Consent</div></header><section id="app" class="card"></section></main>
<script>
"use strict";
const PAIRS=[
{id:"en-03-beekeeping",context:`I keep two hives in the orchard and I want the stronger one to winter without feeding. The weaker colony beside the hedge came through last winter, though it built up very late. A recording hive scale sits under the weaker stand and logs its weight every hour. The strong hive has eight frames of sealed stores and a brood nest still spreading downward. Should I feed syrup now, or first measure what the bees are actually holding? Weigh the hive first, because frame counts mislead badly once the combs are partly filled. Lift the back of the strong floor with a spring balance and double the reading you get. A colony of that size wants roughly eighteen kilograms of stores to reach the willow flow. Feeding after the middle of October rarely helps, since the bees cannot ripen thin syrup. I weighed both hives and the strong one holds about twenty kilograms above the empty weight. The weaker colony beside the hedge came in at barely eleven, which worries me now. Both hives showed mites on the board, roughly four a day under the strong one. Do I treat first and feed afterwards, or does the order not matter at this point? Treat first, because mites damage the very bees that must live through the whole winter. Winter bees are raised in September, so a heavy mite load then costs you the spring. Four mites a day on the board suggests a population worth reducing without any delay. Feed the weaker colony straight afterwards, since eleven kilograms will not carry it to March. I treated both hives and the drop on the boards has fallen to almost nothing. The weaker colony took four litres of syrup within a week and has capped most of it. Now I am wondering about the roofs, because both hives ran damp along the walls. The hive scale shows the weight climbing steadily since the syrup went on last week. Should I insulate above the crown board, or open the entrance wider for more air? Insulate above and leave the entrance as it is, because damp comes from cold ceilings. Warm moist air rises, meets a cold roof and rains straight back onto the cluster. A slab of insulation above the crown board keeps that surface warmer than the walls.`,a:`That resembles this weaker colony a little, provided you look only at the sequence in which things settle.`,b:`That resembles this hive scale a little, provided you look only at the sequence in which things settle.`},
{id:"en-04-masonry",context:`I am rebuilding a drystone retaining wall that bulged badly after the wet autumn last year. The older garden wall along the lane was built by the same hands and stands perfectly straight. I bought a moisture meter for the job, since it reads the damp behind every course. My wall leans outward from about knee height, though the foundation course looks sound enough. Should I take it down to the ground, or only as far as the bulge reaches? Take it down to the ground, because a bulge always begins lower than it appears. Retaining walls fail through the hearting, the small stone packed behind the visible face. If that packing has washed downward, the outer stones carry a load they never should. Lay the stones out in rows as you strip them, keeping the largest for the base. I stripped the wall right down and the hearting behind it had turned almost to gravel. The older garden wall has proper hearting, as I found when a cap stone came loose. I have relaid two courses with a firm batter and each stone touching its neighbours. How much batter does a wall of this height actually need against wet ground behind? About one part in six is usual, so a metre of height leans back sixteen centimetres. Wet ground behind wants more batter and a drainage layer of clean stone against the soil. Set every stone with its long axis running into the wall, never along the face. Through stones at half height will tie the two faces together for the next century. The wall is up to half height with through stones bedded across the whole thickness. I have also started repointing the older garden wall, where the lime has gone powdery. My first mix went off far too quickly and crumbled out of the joints within days.`,a:`I expect this older wall is no different, because what really changed becomes visible only much later on.`,b:`I expect this moisture meter is no different, because what really changed becomes visible only much later on.`},
{id:"en-05-small-engine",context:`My rotary mower has stood in the shed for three seasons and now refuses to start. The older strimmer beside it started on the third pull despite sitting just as long. I clipped a digital tachometer to the lead, because it counts every firing for me. The mower gives one weak cough on cold mornings and then nothing at all afterwards. Should I strip the carburettor first, or check for a spark before touching anything else? Check for a spark first, because it takes two minutes and rules out half the causes. Pull the plug, earth it against the head and watch the gap in dim light.`,a:`The same order appears with this older strimmer, where a later step means nothing without the earlier one.`,b:`The same order appears with this tachometer, where a later step means nothing without the earlier one.`},
{id:"en-08-orchard",context:`I am grafting scions from an old apple variety onto seedling rootstocks in the bottom orchard. An old pear tree stands at the top of the same slope and fruits every second year. A frost thermometer hangs among the trees and keeps the lowest reading of each night. My whip graft looks neat enough, though the cambium only meets along one side of the cut. Does that matter much, or will the union close anyway once the sap begins to rise? One good side of contact is enough, provided you bind it firmly and seal every opening. Cambium meeting on both sides simply gives you two chances instead of one, nothing more. Bind from below upwards so rain runs off the tape rather than into the joint. Then wax the top of the scion, because most failures come from drying, not from cold. I bound and waxed twelve grafts and eight of them have pushed strong shoots already. Three did nothing at all and one pushed briefly before wilting in the first warm week. The frost thermometer recorded minus four on two nights just after I finished the grafting. The old pear tree was in full blossom then and lost most of its flowers. Would that frost alone kill a fresh union, or does the wilting point to something else? Minus four will not kill a bound graft, since the union sits under tape and wax. A graft that pushes and then wilts has almost always dried out at the join. Check whether the tape loosened, because a small gap lets wind take the moisture out. Losing pear blossom to the same frost tells you nothing about wood that is still dormant. The tape on the failed grafts had indeed worked loose near the top of the scion. I rebound the survivors more tightly and every one of them is still growing well. Now the shoots are a foot long and beginning to lean away from the stem. Should I stake each shoot, or cut them back to encourage a stronger union first? Stake them and leave the length alone, because a growing shoot feeds the union below. Cutting back now slows the very growth that thickens the joint through the first summer.`,a:`That puts me faintly in mind of this old pear tree, if you consider nothing but the sequence of the stages.`,b:`That puts me faintly in mind of this frost thermometer, if you consider nothing but the sequence of the stages.`},
{id:"en-15-thatching",context:`I am stripping the old thatch from a cottage roof and laying a fresh coat of water reed. A smaller barn stands behind the cottage, and its straw thatch was renewed only three winters ago. I keep a moisture meter in the workshop, because reed cut in a wet season never dries evenly. The rafters look sound, though the ridge has slumped badly along the eastern half of the run. Should I strip the whole roof down to the battens, or work in courses from the eaves upward? Strip only what is spent, because sound underthatch left in place saves both time and reed. A slumped ridge usually means the fixings beneath have rotted rather than the reed itself failing. Work upward in courses from the eaves, and never begin the ridge until the coat is complete. Each course must be dressed home hard before the next one is laid above it. I stripped back to the underthatch and found the eastern rafters damp but not yet soft. The moisture meter reads twenty-four percent up there and only fifteen along the western slope. Rain has been driving against that gable for years, and the eaves course sits low there. Do I let the timber dry first, or can I thatch straight over it now? Let it dry, because reed laid over damp oak traps the wet against the rafter. Twenty-four percent will fall within a fortnight if you sheet the roof and leave the gable open. Meanwhile lift the eaves course on that side with a fillet, so rain sheds clear. A roof that throws water off its edge will outlast one that merely holds it. The moisture meter fell to sixteen percent in ten days, and the fillet lifted the eaves. I have laid four courses of reed and dressed each one home with the leggett. The straw barn behind the cottage has a much shallower pitch than this roof does. Should the courses lie at a different angle here, or does the pitch not matter? Pitch governs everything in thatch, and a shallow roof needs a longer overlap between courses. On a steep roof like yours the water leaves quickly, so the courses may lie thinner.`,a:`That puts me in mind of this straw barn a little, provided you look purely at the order in which things settle.`,b:`That puts me in mind of this moisture meter a little, provided you look purely at the order in which things settle.`}
];
const answers=["Sentence A sounds more natural","Sentence B sounds more natural","Both sound equally natural","Both sound equally unnatural"],app=document.querySelector("#app"),statusEl=document.querySelector("#status"),sessionId=crypto.randomUUID(),state={phase:"consent",index:-1,order:[],sides:{},responses:[],events:[],started_at:null,ended_at:null,pair_shown_at:null,context_returns:0,context_armed:false,context_visible:false};
function randomInt(max){const a=new Uint32Array(1),limit=2**32-(2**32%max);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function event(type,previous,newState,data={}){state.events.push({event_id:crypto.randomUUID(),aggregate_id:sessionId,aggregate_type:"TimingPilotSession",event_type:type,previous_state:previous,new_state:newState,actor_id:"anonymous-local-participant",actor_type:"human",timestamp:new Date().toISOString(),correlation_id:sessionId,...data})}function setPhase(next,type,data={}){const previous=state.phase;state.phase=next;event(type,previous,next,data);render()}
function consent(){app.innerHTML=`<h1>Before you begin</h1><p class="lead">We are studying how people judge whether sentences sound natural in a conversation.</p><p>We will show you excerpts from conversations about craft work and ask for brief judgements. <strong>We are not testing your knowledge or skill</strong> — we are interested in your impression of the language.</p><p>The task has 5 questions. <strong>We do not yet know how long it takes — that is what we are measuring.</strong></p><p>We do not ask for your name or contact details, and we do not collect information that could identify you.</p><p>Taking part is voluntary; you may stop at any time by closing this window.</p><p class="note">Your result stays on this device. At the end you can copy it as JSON.</p><button id="start">I understand and want to begin</button>`;document.querySelector("#start").onclick=start}
function start(){state.started_at=new Date().toISOString();state.order=shuffle(PAIRS.map(p=>p.id));for(const p of PAIRS)state.sides[p.id]=randomInt(2)?{A:"a",B:"b"}:{A:"b",B:"a"};state.index=0;setPhase("pair_active","ConsentAccepted",{screen_width:window.innerWidth,display_order:state.order,side_assignment:state.sides})}
function showPair(){const p=PAIRS.find(x=>x.id===state.order[state.index]),side=state.sides[p.id];state.pair_shown_at=performance.now();state.context_returns=0;state.context_armed=false;state.context_visible=false;statusEl.textContent=`Question ${state.index+1} of ${PAIRS.length}`;app.innerHTML=`<div class="pair-meta">Conversation excerpt</div><h2>Read the context, then compare the sentences.</h2><div id="context" class="context"><span class="context-label">Conversation context</span>${p.context}</div><div class="sentences"><div class="sentence"><b>SENTENCE A</b>${p[side.A]}</div><div class="sentence"><b>SENTENCE B</b>${p[side.B]}</div></div><div id="choices" class="answers"><span class="answer-label">Which sentence sounds more natural?</span>${answers.map((x,i)=>`<button data-choice="${["A","B","equal","equally_unnatural"][i]}">${x}</button>`).join("")}</div>`;document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>answer(b.dataset.choice));observeContext()}
function observeContext(){const c=document.querySelector("#context"),choices=document.querySelector("#choices");new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))state.context_armed=true},{threshold:.35}).observe(choices);new IntersectionObserver(es=>{const visible=es[0].isIntersecting;if(state.context_armed&&visible&&!state.context_visible)state.context_returns++;state.context_visible=visible},{threshold:.25}).observe(c)}
function answer(choice){const p=PAIRS.find(x=>x.id===state.order[state.index]),side=state.sides[p.id],duration=Math.round(performance.now()-state.pair_shown_at);state.responses.push({pair_id:p.id,response:choice,pair_duration_ms:duration,context_returns:state.context_returns,side_assignment:side});event("PairAnswered","pair_active",state.index===PAIRS.length-1?"debrief":"pair_active",{pair_id:p.id,response:choice,pair_duration_ms:duration,context_returns:state.context_returns,side_assignment:side});if(++state.index<PAIRS.length){showPair();window.scrollTo({top:0,behavior:"instant"})}else setPhase("debrief","AllPairsAnswered")}
function debrief(){statusEl.textContent="Final questions";app.innerHTML=`<h1>Two final questions</h1><div class="field"><label for="rule">Did you notice any rule in how the compared sentences differed? If so, what was it?</label><small>Optional</small><textarea id="rule"></textarea></div><div class="field"><label>How tiring did you find this task?</label><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="fatigue" value="${n}">${n}</label>`).join("")}</div></div><button id="finish" disabled>Save answers</button>`;document.querySelectorAll("[name=fatigue]").forEach(x=>x.onchange=()=>document.querySelector("#finish").disabled=false);document.querySelector("#finish").onclick=finish}
function finish(){state.ended_at=new Date().toISOString();state.debrief={noticed_rule:document.querySelector("#rule").value.trim(),fatigue:Number(document.querySelector("[name=fatigue]:checked").value)};setPhase("completed","DebriefSubmitted")}function result(){return{schema_version:"spektra-timing-pilot/1.0",session_id:sessionId,language:"en",state:state.phase,started_at:state.started_at,ended_at:state.ended_at,total_duration_ms:new Date(state.ended_at)-new Date(state.started_at),screen_width:window.innerWidth,display_order:state.order,side_assignment:state.sides,responses:state.responses,debrief:state.debrief,events:state.events}}
function done(){statusEl.textContent="Completed";const data=JSON.stringify(result(),null,2),last=state.events.at(-1);app.innerHTML=`<h1>Thank you</h1><p class="lead">Your result is ready to copy. Nothing has been sent.</p><div class="proof"><div><b>Status</b>Completed</div><div><b>Total time</b>${Math.round(result().total_duration_ms/1000)} s</div><div><b>Event ID</b>${last.event_id.slice(0,8)}…</div></div><button id="copy">Copy result as JSON</button><p id="copyStatus" role="status"></p><textarea class="json" id="json" readonly>${data}</textarea>`;document.querySelector("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(data);document.querySelector("#copyStatus").textContent="Copied"}catch(e){document.querySelector("#json").select();document.querySelector("#copyStatus").textContent="Automatic copying was unavailable. Select the text below and copy it manually."}}}
function render(){if(state.phase==="consent"){statusEl.textContent="Consent";consent()}else if(state.phase==="pair_active")showPair();else if(state.phase==="debrief")debrief();else if(state.phase==="completed")done()}window.addEventListener("beforeunload",()=>{if(!["consent","completed"].includes(state.phase))event("SessionAbandoned",state.phase,"abandoned")});render();
</script></body></html>
