# SPEKTRA-1 — konfiguracja pieczętowana (protokół §2)
# UWAGA: pola oznaczone TBD-RECON zostaną wypełnione po rekonesansie maszyny
# pomiarowej (ops/DEP-zlecenie-01-rekonesans.md) i decyzji o wariancie modelu.
# Po PIECZĘCI ten plik jest niezmienny — zmiany wyłącznie jawnym aneksem.

model:
  # Wariant 4B nie jest wyborem preferencyjnym tylko jedynym wykonalnym: 16 GB VRAM
  # nie pomiesci wiekszego wariantu w bf16, a kwantyzacja unieważnia pomiar.
  # Klasa zwracana przez AutoModelForCausalLM to Gemma3ForConditionalGeneration
  # (model obraz+tekst); mierzymy wieze TEKSTOWA: hidden_size 2560, 34 bloki.
  hf_name: google/gemma-3-4b-it
  hf_revision: 093f9f388b31de276ce2de164bdc2081324b9767
  n_blocks: 34              # hidden_states ma 35 elementow: [0] = embedding, [1..34] = bloki
  hidden_size: 2560
  weights_sha256:
    model-00001-of-00002.safetensors: eb5fd5e97ddd07b56778733e9653c07312529cb00980a318fc3e1c4e3b5a8f1f
    model-00002-of-00002.safetensors: fdde0e5aa5ced0fa203b3d50f4ab78168b7e3a3e08c6349f5cc9326666e1bb13
    model.safetensors.index.json: 77f4b67de084c31c7bcd373b039908108eee6c6181607e6d53da730e5f0bc659
  tokenizer_files_sha256:
    tokenizer.json: 4667f2089529e8e7657cfb6d1c19910ae71ff5f28aa7ab2ff2763330affad795
    tokenizer_config.json: bfe25c2735e395407beb78456ea9a6984a1f00d8c16fa04a8b75f2a614cf53e1
    special_tokens_map.json: 2f7b0adf4fb469770bb1490e3e35df87b1dc578246c5e7e6fc76ecf33213a397
    added_tokens.json: 50b2f405ba56a26d4913fd772089992252d7f942123cc0a034d96424221ba946
  # DEFINICJA (szablon nie jest osobnym plikiem w snapshocie): SHA-256 z samego
  # TEKSTU szablonu, odczytanego z pola `chat_template` w tokenizer_config.json,
  # zakodowanego w UTF-8, bez opakowania JSON i bez znaku konca linii na koncu.
  # Bez tej definicji suma jest nieodtwarzalna.
  chat_template_sha256: 7de1c58e208eda46e9c7f86397df37ec49883aeece39fb961e0a6b24088dd3c4
  # Snapshot NIE zawiera preprocessor_config.json - jest kompletny dla trybu
  # TEKSTOWEGO, nie dla obrazowego. Manifest pieczeci nie moze twierdzic inaczej.
  snapshot_complete_for: text_only

environment:
  lockfile: requirements-lock.txt
  lockfile_sha256: e4c1f95420770a1ff731ea7611c7f17961d582ec04c2be54cb1787ec1552c624
  pytorch_index_url: https://download.pytorch.org/whl/cu128
  python: "3.14.4"
  torch: 2.9.1+cu128
  transformers: 5.14.1     # linia 5.x - argument `dtype=`, NIE `torch_dtype=`
  machine: maszyna-pomiarowa (RTX 5080, sm_120, 15.92 GB VRAM, Windows 11 Home)
  seal_mode: venv_lockfile # zamiast obrazu kontenera (brak Dockera/WSL2 na maszynie)

compute:
  dtype: bfloat16           # forward główny (protokół §2)
  fp32_control_fraction: 0.10
  fp32_tolerance_abs_delta_I_total: 0.005
  # Kontrola fp32 zostaje NA GPU mimo przelewania do RAM (~16.4 GB przy 15.92 GB).
  # Powod: kontrola ma izolowac WYLACZNIE dtype. Przeniesienie jej na CPU zmienialoby
  # jednoczesnie dtype i urzadzenie, czyli mieszaloby dwa czynniki w tescie, ktory
  # istnieje po to, by rozdzielic jeden. Przelewanie kosztuje czas, nie arytmetyke,
  # a dotyczy 10% tekstow.
  fp32_control_device: cuda
  # Bramka pamieci - patrz pipeline/memory_guard.py. Sterownik przelewa nadmiar
  # do RAM po cichu, wiec brak bledu CUDA nie jest dowodem zmieszczenia sie.
  memory_guard_limit_gb: 14.0
  fp32_control_limit_gb: 24.0
  tf32: false
  deterministic_kernels: true
  batch_size: 1
  padding: none

measurement:
  token_budget: 1024        # T, budowa do budżetu z naturalnym zakończeniem
  skip_first_tokens: 32
  mask_special_tokens: true
  low_variance_channel_eps: 1.0e-6
  positional_component: subtract_mean_per_position  # wariant bez = GATE 3b
  # DECYZJA KIEROWNIKA BADANIA, PODJETA 2026-07-30: equalize.
  # Kontekst: pomiar dokladnym tokenizerem wykazal, ze wariant C'-G jest co
  # najmniej tak dlugi jak C we WSZYSTKICH 16 scenariuszach (roznica srednio
  # -0.32% EN, -0.48% PL). Zrodlo jest strukturalne: samoodniesienie uzywa
  # tanich slow deiktycznych, odniesienie osadzone wymaga drozszego rzeczownika,
  # wiec pracy autorskiej nie da sie tym kierunku doprowadzic do konca.
  # Wspolne okno = min T' po wariantach scenariusza -> T'/D identyczne
  # z konstrukcji, znika CALA zaleznosc od dlugosci (nie tylko ta czesc,
  # ktora lapie lambda*), i to naraz we WSZYSTKICH czterech kontrastach,
  # wlacznie z C-B przechylonym 8/8.
  token_window_mode: equalize
  report_dropped_tokens: true   # liczba odrzuconych tokenow per scenariusz
                                # i wariant wchodzi do pakietu pieczeci
  layer_band: [0.4, 0.8]    # ułamek L; indeksacja wg raportu layer_semantics.md (T2)
  # Zweryfikowane hookami 2026-07-30 (docs/layer_semantics.md):
  layer_indexing:
    embedding_index: 0             # hidden_states[0] - wykluczony z pasm
    block_offset: 1                # hidden_states[l+1] = wyjscie bloku l
    raw_blocks: [0, 32]            # surowe (przed final norm), potwierdzone co do zera
    post_norm_index: 34            # hidden_states[34] JEST po final norm
    excluded_from_measurement: [34]
    band_block_indices: [13, 26]   # wlacznie; = hidden_states[14..27]
    global_attention_blocks: [5, 11, 17, 23, 29]   # reszta lokalna (wzorzec 5:1)
    band_composition: {globalna: 2, lokalna: 12}
  chat_template_verified: true     # render generatora == tokenizer.apply_chat_template

analysis:
  alpha: 0.01
  one_sided: true
  n_permutations: 10000
  d_lag_permutations: 500
  lambda_star_quantile: 0.99
  sesoi_d_z: 0.8            # ZAMROŻONE: zwiad na efekty duże (protokół §7 GATE 1)
  power_target: 0.90
  tost_margin_abs_d: 0.3
  pilot_scenarios_per_language: 8
  languages: [pl, en]

seeds:
  gate0: 20260728
  corpus_generation: 20260730
  null_simulation: 20260731
  power_simulation: 20260801
  permutation_tests: 20260802
